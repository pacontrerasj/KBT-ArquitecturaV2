name: CI/CD Pipeline
on:
  push:
    branches: [ main ]

jobs:
  # 1. Calidad y seguridad de IaC
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: terraform-linters/setup-tflint@v3
      - name: Init TFLint
        run: tflint --init
        working-directory: terraform
      - name: Run TFLint
        run: tflint -f compact
        working-directory: terraform

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: true # No bloquea el despliegue (modo permisivo para el lab)
          skip_check: CKV_K8S_43 # Pin por digest: no viable con imagenes etiquetadas por SHA en CI

      - name: Validate Kubernetes YAMLs (offline, sin cluster)
        run: |
          python -m pip install --quiet pyyaml
          python -c "import glob, yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml')]; print('K8s YAML OK')"

  # 2. Aprovisiona la infraestructura con Terraform
  terraform:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    outputs:
      rds_endpoint: ${{ steps.tf_outputs.outputs.rds_endpoint }}
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap Terraform backend (S3 + DynamoDB)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="freshbox-tfstate-${ACCOUNT_ID}"
          TABLE="freshbox-terraform-lock"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          if ! aws dynamodb describe-table --table-name "$TABLE" >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST --region "$AWS_REGION"
            aws dynamodb wait table-exists --table-name "$TABLE"
          fi
          echo "TF_BACKEND_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "TF_BACKEND_TABLE=$TABLE" >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="dynamodb_table=${TF_BACKEND_TABLE}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> "$GITHUB_OUTPUT"

  # 3. Construye, escanea y publica las imagenes en ECR
  build-and-push:
    needs: terraform
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    strategy:
      matrix:
        include:
          - service: get-products
            context: Freshbox/microserviciosEKSBackend/get-products
          - service: create-product
            context: Freshbox/microserviciosEKSBackend/create-product
          - service: update-product
            context: Freshbox/microserviciosEKSBackend/update-product
          - service: delete-product
            context: Freshbox/microserviciosEKSBackend/delete-product
          - service: frontend
            context: Freshbox/microservicioEKSFrontend
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Scan Docker Image
        run: |
          IMAGE_TAG=${{ steps.login-ecr.outputs.registry }}/freshbox-${{ matrix.service }}:${{ github.sha }}
          docker build -t $IMAGE_TAG ${{ matrix.context }}
          docker push $IMAGE_TAG

          # Scan using Trivy (monta el socket para que vea la imagen local)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --image-src docker $IMAGE_TAG

  # 4. Despliega los manifiestos en EKS
  deploy:
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      DB_HOST: ${{ needs.terraform.outputs.rds_endpoint }}
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name freshbox-eks --region ${{ env.AWS_REGION }}

      - name: Apply namespace, configmap and secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create configmap freshbox-config -n freshbox \
            --from-literal=DB_HOST="${DB_HOST}" \
            --from-literal=DB_NAME=freshbox \
            --from-literal=DB_PORT=3306 \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic freshbox-secret -n freshbox \
            --from-literal=DB_USER=alumno \
            --from-literal=DB_PASS=alumno123 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply network policy, HPA and ingress
        run: |
          kubectl apply -f k8s/network-policy.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy services
        run: |
          for s in frontend get-products create-product update-product delete-product; do
            kubectl apply -f k8s/$s-deployment.yaml
            kubectl set image deployment/$s \
              $s=${{ steps.login-ecr.outputs.registry }}/freshbox-$s:${{ github.sha }} \
              -n freshbox
          done
          kubectl rollout status deployment -n freshbox --timeout=180s || true
