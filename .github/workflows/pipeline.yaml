name: CI/CD Pipeline
on:
  push:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. TFLint: Calidad de código Terraform
      - uses: terraform-linters/setup-tflint@v3
      - name: Init TFLint
        run: tflint --init
        working-directory: terraform
      - name: Run TFLint
        run: tflint -f compact
        working-directory: terraform

      # 2. Checkov: Escaneo de seguridad en IaC (Terraform + K8s)
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: true # No bloquea el despliegue (modo permisivo para el lab)
          skip_check: CKV_K8S_43 # Pin por digest: no viable con imagenes etiquetadas por SHA en CI

      # 3. Validación de Kubernetes YAMLs (offline, sin cluster)
      - name: Validate Kubernetes YAMLs
        run: |
          python -m pip install --quiet pyyaml
          python -c "import glob, yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml')]; print('K8s YAML OK')"

  build-and-push:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: 'us-east-1'
    strategy:
      matrix:
        service: [get-products, create-product, update-product, delete-product]
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names freshbox-${{ matrix.service }} --region ${{ env.AWS_REGION }} \
            || aws ecr create-repository --repository-name freshbox-${{ matrix.service }} \
                 --image-tag-mutability IMMUTABLE \
                 --image-scanning-configuration scanOnPush=true \
                 --region ${{ env.AWS_REGION }}

      - name: Build and Scan Docker Image
        run: |
          # Build context is specific to the service directory
          IMAGE_TAG=${{ steps.login-ecr.outputs.registry }}/freshbox-${{ matrix.service }}:${{ github.sha }}
          docker build -t $IMAGE_TAG ./Freshbox/microserviciosEKSBackend/${{ matrix.service }}
          docker push $IMAGE_TAG
          
          # Scan using Trivy (monta el socket para que vea la imagen local)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --image-src docker $IMAGE_TAG

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name freshbox-eks --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          # El namespace debe existir antes de aplicar los Deployments
          kubectl apply -f k8s/namespace.yaml
          # Apply the deployment for this specific service
          kubectl apply -f k8s/${{ matrix.service }}-deployment.yaml
          # Usa la imagen recien construida (tag con el SHA del commit)
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=${{ steps.login-ecr.outputs.registry }}/freshbox-${{ matrix.service }}:${{ github.sha }} \
            -n freshbox