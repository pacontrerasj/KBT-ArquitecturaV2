name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      replace_eks_nodes:
        description: 'Forzar recreacion del node group de EKS (solo si no hay nodos Ready)'
        type: boolean
        default: false

# Serializa los runs: sin lock en DynamoDB confiamos en GitHub para la exclusión mutua
concurrency:
  group: freshbox-cicd
  cancel-in-progress: false

jobs:
  # 1. Calidad y seguridad de IaC
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init and validate (sin backend)
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform

      - name: Init TFLint
        run: tflint --init
        working-directory: terraform
      - name: Run TFLint
        run: tflint -f compact
        working-directory: terraform

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: true # No bloquea el despliegue (modo permisivo para el lab)
          skip_check: CKV_K8S_43 # Pin por digest: no viable con imagenes etiquetadas por SHA en CI

      - name: Validate Kubernetes YAMLs (offline, sin cluster)
        run: |
          python -m pip install --quiet pyyaml
          python -c "import glob, yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml')]; print('K8s YAML OK')"

  # 2. Aprovisiona la infraestructura con Terraform
  terraform:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    outputs:
      rds_endpoint: ${{ steps.tf_outputs.outputs.rds_endpoint }}
      vpc_id: ${{ steps.tf_outputs.outputs.vpc_id }}
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_CLI_ARGS: "-no-color"
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar credenciales AWS (falla rápido si el token expiró)
        run: aws sts get-caller-identity

      - name: Empaquetar Lambdas con dependencias
        run: |
          mkdir -p build/lambdas
          for d in Freshbox/lambdas/*; do
            echo "Empaquetando $d"
            (cd "$d" && npm install --omit=dev --no-package-lock --silent)
          done

      - name: Bootstrap Terraform backend (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="freshbox-ep3-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          echo "TF_BACKEND_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      # Elimina recursos que existen en AWS pero NO están en el state (restos de
      # un apply cancelado/expirado). Nunca toca recursos administrados por Terraform.
      - name: Limpiar huérfanos (no administrados por Terraform)
        working-directory: terraform
        run: |
          managed() { terraform state list 2>/dev/null | grep -qx "$1"; }

          # --- EKS huérfano (conflicto de nombre) ---
          if ! managed 'module.eks.aws_eks_cluster.main' \
             && aws eks describe-cluster --name freshbox-eks >/dev/null 2>&1; then
            echo "::warning::EKS 'freshbox-eks' existe fuera del state; eliminando huérfano"
            for ng in $(aws eks list-nodegroups --cluster-name freshbox-eks \
              --query 'nodegroups' --output text); do
              aws eks delete-nodegroup --cluster-name freshbox-eks --nodegroup-name "$ng" || true
              aws eks wait nodegroup-deleted --cluster-name freshbox-eks --nodegroup-name "$ng" || true
            done
            aws eks delete-cluster --name freshbox-eks || true
            aws eks wait cluster-deleted --name freshbox-eks || true
          fi

          # --- RDS huérfano ---
          if ! managed 'module.rds.aws_db_instance.default'; then
            for db in $(aws rds describe-db-instances \
              --query "DBInstances[?starts_with(DBInstanceIdentifier,'terraform-')].DBInstanceIdentifier" \
              --output text); do
              echo "::warning::RDS huérfano '$db'; eliminando"
              aws rds modify-db-instance --db-instance-identifier "$db" \
                --no-deletion-protection --apply-immediately >/dev/null 2>&1 || true
              aws rds delete-db-instance --db-instance-identifier "$db" \
                --skip-final-snapshot --delete-automated-backups >/dev/null 2>&1 || true
              aws rds wait db-instance-deleted --db-instance-identifier "$db" || true
            done
          fi

          # --- DB subnet group huérfano (tras eliminar el RDS que lo usaba) ---
          if ! managed 'module.rds.aws_db_subnet_group.default' \
             && aws rds describe-db-subnet-groups \
                  --db-subnet-group-name freshbox-db-subnet-group >/dev/null 2>&1; then
            echo "::warning::DB subnet group huérfano; eliminando"
            for i in 1 2 3 4 5 6; do
              aws rds delete-db-subnet-group \
                --db-subnet-group-name freshbox-db-subnet-group && break || sleep 20
            done
          fi

          # --- Frontend ECR obsoleto (EP3 lo publica en S3) ---
          # Si estaba en el state, se elimina del state para que Terraform no
          # intente destruir un repo IMMUTABLE que puede tener imagenes.
          if aws ecr describe-repositories --repository-names freshbox-frontend >/dev/null 2>&1; then
            echo "::warning::ECR 'freshbox-frontend' obsoleto; eliminando"
            aws ecr delete-repository --repository-name freshbox-frontend --force || true
          fi
          terraform state rm 'module.ecr.aws_ecr_repository.repo["frontend"]' 2>/dev/null || true

          # --- ECR en cifrado viejo (AES256) pendiente de KMS ---
          # Un repo con imagenes no se puede "reemplazar" (el destroy usa el estado
          # previo con force_delete=false). Se borra para que Terraform lo RECREE limpio.
          for s in get-products create-product update-product delete-product; do
            enc=$(aws ecr describe-repositories --repository-names "freshbox-$s" \
              --query 'repositories[0].encryptionConfiguration.encryptionType' \
              --output text 2>/dev/null || true)
            if [ "$enc" = "AES256" ]; then
              echo "::warning::ECR 'freshbox-$s' en AES256; borrando para recrearlo con KMS"
              aws ecr delete-repository --repository-name "freshbox-$s" --force
            fi
          done

      - name: Adoptar repos ECR existentes (idempotente)
        working-directory: terraform
        run: |
          for s in get-products create-product update-product delete-product; do
            addr="module.ecr.aws_ecr_repository.repo[\"$s\"]"
            if aws ecr describe-repositories --repository-names "freshbox-$s" >/dev/null 2>&1; then
              if ! terraform state list | grep -qF "$addr"; then
                terraform import "$addr" "freshbox-$s" || true
              fi
            fi
          done

      - name: Terraform Apply
        id: apply
        working-directory: terraform
        continue-on-error: true
        run: |
          REPLACE_ARGS=()
          if [ "${{ github.event.inputs.replace_eks_nodes }}" = "true" ]; then
            REPLACE_ARGS+=("-replace=module.eks.aws_eks_node_group.main")
          fi
          terraform apply -auto-approve -input=false "${REPLACE_ARGS[@]}"

      - name: Diagnóstico del apply (si falló)
        if: steps.apply.outcome == 'failure'
        working-directory: terraform
        run: |
          echo "=========== terraform state list ==========="
          terraform state list || true
          echo "=========== EKS ==========="
          aws eks describe-cluster --name freshbox-eks \
            --query 'cluster.{status:status,health:health,version:version}' 2>&1 || true
          echo "=========== RDS ==========="
          aws rds describe-db-instances \
            --query 'DBInstances[].{id:DBInstanceIdentifier,status:DBInstanceStatus}' \
            --output table 2>&1 || true
          echo "=========== errored.tfstate ==========="
          ls -la errored.tfstate 2>/dev/null || echo "sin errored.tfstate"

      - name: Subir errored.tfstate (si existe)
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: errored-tfstate
          path: terraform/errored.tfstate
          if-no-files-found: ignore

      - name: Fallar el job si el apply falló
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$(terraform output -raw vpc_id)" >> "$GITHUB_OUTPUT"

  # 3. Construye, escanea y publica las imagenes en ECR
  build-and-push:
    needs: terraform
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    strategy:
      matrix:
        include:
          - service: get-products
            context: Freshbox/microserviciosEKSBackend/get-products
          - service: create-product
            context: Freshbox/microserviciosEKSBackend/create-product
          - service: update-product
            context: Freshbox/microserviciosEKSBackend/update-product
          - service: delete-product
            context: Freshbox/microserviciosEKSBackend/delete-product
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Scan Docker Image
        run: |
          IMAGE_TAG=${{ steps.login-ecr.outputs.registry }}/freshbox-${{ matrix.service }}:${{ github.sha }}-${{ github.run_number }}
          docker build -t $IMAGE_TAG ${{ matrix.context }}
          docker push $IMAGE_TAG

          # Scan using Trivy (monta el socket para que vea la imagen local)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --image-src docker $IMAGE_TAG

  # 4. Despliega los manifiestos en EKS
  deploy:
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    outputs:
      alb_dns: ${{ steps.alb.outputs.dns }}
    env:
      AWS_REGION: us-east-1
      DB_HOST: ${{ needs.terraform.outputs.rds_endpoint }}
      VPC_ID: ${{ needs.terraform.outputs.vpc_id }}
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name freshbox-eks --region ${{ env.AWS_REGION }}

      - name: Esperar nodos EKS
        run: |
          READY_NODES=0
          for i in $(seq 1 60); do
            READY_NODES=$(kubectl get nodes -o json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for n in d.get("items",[]) if any(c.get("type")=="Ready" and c.get("status")=="True" for c in n.get("status",{}).get("conditions",[]))))' 2>/dev/null || echo 0)
            if [ "$READY_NODES" -ge 1 ]; then break; fi
            sleep 10
          done
          if [ "$READY_NODES" -lt 1 ]; then
            echo "No hay nodos Ready en freshbox-eks"
            kubectl get nodes -o wide || true
            aws eks describe-nodegroup --cluster-name freshbox-eks \
              --nodegroup-name freshbox-nodes --region "$AWS_REGION" \
              --query 'nodegroup.{status:status,health:health,desired:scalingConfig.desiredSize,subnets:subnets}' || true
            aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=tag:kubernetes.io/cluster/freshbox-eks,Values=owned,shared" \
              --query 'Reservations[].Instances[].{id:InstanceId,state:State.Name,type:InstanceType,subnet:SubnetId}' \
              --output table || true
            exit 1
          fi
          kubectl get nodes -o wide

      - name: Instalar AWS Load Balancer Controller
        uses: azure/setup-helm@v4
      - name: Configurar AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          kubectl create serviceaccount aws-load-balancer-controller -n kube-system \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=freshbox-eks \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=${AWS_REGION} \
            --set vpcId=${VPC_ID} \
            --set replicaCount=1
          kubectl rollout status deployment/aws-load-balancer-controller \
            -n kube-system --timeout=300s

      - name: Diagnóstico AWS Load Balancer Controller
        if: failure()
        run: |
          kubectl get pods -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller -o wide || true
          kubectl describe pod -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller || true
          kubectl logs -n kube-system \
            -l app.kubernetes.io/name=aws-load-balancer-controller --tail=200 || true
          kubectl get events -n kube-system --sort-by=.lastTimestamp | tail -50 || true

      - name: Apply namespace, configmap and secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create configmap freshbox-config -n freshbox \
            --from-literal=DB_HOST="${DB_HOST}" \
            --from-literal=DB_NAME=freshbox \
            --from-literal=DB_PORT=3306 \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic freshbox-secret -n freshbox \
            --from-literal=DB_USER=alumno \
            --from-literal=DB_PASS="${DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap freshbox-db-init-sql -n freshbox \
            --from-file=init.sql=sql/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Quitar frontend de EKS
        run: |
          kubectl delete deployment frontend -n freshbox --ignore-not-found
          kubectl delete service frontend -n freshbox --ignore-not-found

      - name: Apply network policy and HPA
        run: |
          kubectl apply -f k8s/network-policy.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Deploy 4 backends
        run: |
          for s in get-products create-product update-product delete-product; do
            kubectl apply -f k8s/$s-deployment.yaml
            kubectl set image deployment/$s \
              $s=${{ steps.login-ecr.outputs.registry }}/freshbox-$s:${{ github.sha }}-${{ github.run_number }} \
              -n freshbox
          done
          for s in get-products create-product update-product delete-product; do
            kubectl rollout status deployment/$s -n freshbox --timeout=300s
          done

      - name: Apply ALB Ingress
        run: kubectl apply -f k8s/ingress.yaml

      - name: Esperar DNS del ALB
        id: alb
        run: |
          ALB_DNS=""
          for i in $(seq 1 60); do
            ALB_DNS=$(kubectl get ingress freshbox-ingress -n freshbox \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ALB_DNS" ]; then break; fi
            sleep 10
          done
          if [ -z "$ALB_DNS" ]; then
            kubectl describe ingress freshbox-ingress -n freshbox || true
            kubectl get events -n freshbox --sort-by=.lastTimestamp | tail -30 || true
            exit 1
          fi
          echo "dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "ALB DNS: $ALB_DNS"

      - name: Diagnóstico K8s (si algo falló)
        if: failure()
        run: |
          echo "=========== NODES ==========="
          kubectl get nodes -o wide || true
          echo "=========== PODS ==========="
          kubectl get pods -n freshbox -o wide || true
          echo "=========== DESCRIBE PODS ==========="
          kubectl describe pods -n freshbox || true
          echo "=========== INGRESS ==========="
          kubectl describe ingress -n freshbox || true
          echo "=========== EVENTS ==========="
          kubectl get events -n freshbox --sort-by=.lastTimestamp || true
          echo "=========== LOGS ==========="
          kubectl logs -n freshbox --all-containers=true --tail=50 \
            -l 'app in (get-products,create-product,update-product,delete-product)' || true

  # 5. Cierra API Gateway -> ALB, publica frontend en S3 e inicializa MySQL
  finalize:
    needs: [terraform, build-and-push, deploy]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_CLI_ARGS: "-no-color"
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      ALB_DNS: ${{ needs.deploy.outputs.alb_dns }}
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar credenciales AWS
        run: aws sts get-caller-identity

      - name: Bootstrap Terraform backend (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="freshbox-ep3-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          echo "TF_BACKEND_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Empaquetar Lambdas con dependencias
        run: |
          mkdir -p build/lambdas
          for d in Freshbox/lambdas/*; do
            (cd "$d" && npm install --omit=dev --no-package-lock --silent)
          done

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Apply con ALB DNS
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -var="alb_dns=${ALB_DNS}"

      - name: Obtener URL de API Gateway
        id: api
        working-directory: terraform
        run: echo "url=$(terraform output -raw api_invoke_url)" >> "$GITHUB_OUTPUT"

      - name: Crear y configurar bucket S3 del frontend
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="freshbox-frontend-${ACCOUNT_ID}"
          echo "S3_BUCKET=$BUCKET" >> "$GITHUB_ENV"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3 website "s3://${BUCKET}" \
            --index-document index.html --error-document index.html

          cat > /tmp/freshbox-frontend-policy.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "PublicReadGetObject",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::${BUCKET}/*"
            }]
          }
          EOF
          aws s3api put-bucket-policy --bucket "$BUCKET" \
            --policy file:///tmp/freshbox-frontend-policy.json

          rm -rf /tmp/freshbox-frontend
          cp -r Freshbox/microservicioEKSFrontend /tmp/freshbox-frontend
          printf 'window.FRESHBOX_API_BASE = "%s";\n' "$API_URL" \
            > /tmp/freshbox-frontend/js/config.js
          aws s3 sync /tmp/freshbox-frontend "s3://${BUCKET}" --delete \
            --exclude "Dockerfile" --exclude "nginx.conf"

          FRONTEND_URL="http://${BUCKET}.s3-website-${AWS_REGION}.amazonaws.com"
          echo "FRONTEND_URL=$FRONTEND_URL" >> "$GITHUB_ENV"
          {
            echo "### FreshBox EP3"
            echo "- API Gateway: $API_URL"
            echo "- Frontend S3: $FRONTEND_URL"
            echo "- RDS: ${{ needs.terraform.outputs.rds_endpoint }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inicializar MySQL con init.sql
        run: |
          aws eks update-kubeconfig --name freshbox-eks --region "$AWS_REGION"
          kubectl create configmap freshbox-db-init-sql -n freshbox \
            --from-file=init.sql=sql/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete job freshbox-db-init -n freshbox --ignore-not-found
          kubectl apply -f k8s/db-init-job.yaml
          if ! kubectl wait --for=condition=complete job/freshbox-db-init \
               -n freshbox --timeout=600s; then
            kubectl describe job freshbox-db-init -n freshbox || true
            kubectl logs job/freshbox-db-init -n freshbox --tail=100 || true
            exit 1
          fi

      - name: Pruebas end-to-end
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/api/products" > /tmp/products.json; then break; fi
            sleep 10
          done
          cat /tmp/products.json
          test "$(jq 'length' /tmp/products.json)" -ge 1

          USER_ID="ci-$(date +%s)"
          curl -fsS -X POST "$API_URL/api/cart" \
            -H 'Content-Type: application/json' \
            -d "{\"userId\":\"$USER_ID\",\"productId\":\"1\",\"nombre\":\"Manzana organica\",\"precio\":990,\"cantidad\":1}" \
            > /tmp/cart-create.json
          cat /tmp/cart-create.json
          curl -fsS "$API_URL/api/cart?userId=$USER_ID" > /tmp/cart.json
          cat /tmp/cart.json
          test "$(jq '.items | length' /tmp/cart.json)" -eq 1

          curl -fsS -X POST "$API_URL/api/orders" \
            -H 'Content-Type: application/json' \
            -d "{\"userId\":\"$USER_ID\"}" > /tmp/order.json
          cat /tmp/order.json
          jq -e '.orderId and .total' /tmp/order.json >/dev/null

          for i in $(seq 1 20); do
            curl -fsS "$API_URL/api/cart?userId=$USER_ID" > /tmp/cart-after.json
            if [ "$(jq '.items | length' /tmp/cart-after.json)" -eq 0 ]; then break; fi
            sleep 5
          done
          cat /tmp/cart-after.json
          test "$(jq '.items | length' /tmp/cart-after.json)" -eq 0
