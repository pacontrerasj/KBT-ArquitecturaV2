name: CI/CD Pipeline
on:
  push:
    branches: [ main ]

# Serializa los runs: sin lock en DynamoDB confiamos en GitHub para la exclusión mutua
concurrency:
  group: freshbox-cicd
  cancel-in-progress: false

jobs:
  # 1. Calidad y seguridad de IaC
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: terraform-linters/setup-tflint@v3
      - name: Init TFLint
        run: tflint --init
        working-directory: terraform
      - name: Run TFLint
        run: tflint -f compact
        working-directory: terraform

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: true # No bloquea el despliegue (modo permisivo para el lab)
          skip_check: CKV_K8S_43 # Pin por digest: no viable con imagenes etiquetadas por SHA en CI

      - name: Validate Kubernetes YAMLs (offline, sin cluster)
        run: |
          python -m pip install --quiet pyyaml
          python -c "import glob, yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml')]; print('K8s YAML OK')"

  # 2. Aprovisiona la infraestructura con Terraform
  terraform:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    outputs:
      rds_endpoint: ${{ steps.tf_outputs.outputs.rds_endpoint }}
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_CLI_ARGS: "-no-color"
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar credenciales AWS (falla rápido si el token expiró)
        run: aws sts get-caller-identity

      - name: Bootstrap Terraform backend (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="freshbox-tfstate-${ACCOUNT_ID}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          echo "TF_BACKEND_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      # Elimina recursos que existen en AWS pero NO están en el state (restos de
      # un apply cancelado/expirado). Nunca toca recursos administrados por Terraform.
      - name: Limpiar huérfanos (no administrados por Terraform)
        working-directory: terraform
        run: |
          managed() { terraform state list 2>/dev/null | grep -qx "$1"; }

          # --- EKS huérfano (conflicto de nombre) ---
          if ! managed 'module.eks.aws_eks_cluster.main' \
             && aws eks describe-cluster --name freshbox-eks >/dev/null 2>&1; then
            echo "::warning::EKS 'freshbox-eks' existe fuera del state; eliminando huérfano"
            for ng in $(aws eks list-nodegroups --cluster-name freshbox-eks \
              --query 'nodegroups' --output text); do
              aws eks delete-nodegroup --cluster-name freshbox-eks --nodegroup-name "$ng" || true
              aws eks wait nodegroup-deleted --cluster-name freshbox-eks --nodegroup-name "$ng" || true
            done
            aws eks delete-cluster --name freshbox-eks || true
            aws eks wait cluster-deleted --name freshbox-eks || true
          fi

          # --- RDS huérfano ---
          if ! managed 'module.rds.aws_db_instance.default'; then
            for db in $(aws rds describe-db-instances \
              --query "DBInstances[?starts_with(DBInstanceIdentifier,'terraform-')].DBInstanceIdentifier" \
              --output text); do
              echo "::warning::RDS huérfano '$db'; eliminando"
              aws rds modify-db-instance --db-instance-identifier "$db" \
                --no-deletion-protection --apply-immediately >/dev/null 2>&1 || true
              aws rds delete-db-instance --db-instance-identifier "$db" \
                --skip-final-snapshot --delete-automated-backups >/dev/null 2>&1 || true
              aws rds wait db-instance-deleted --db-instance-identifier "$db" || true
            done
          fi

          # --- DB subnet group huérfano (tras eliminar el RDS que lo usaba) ---
          if ! managed 'module.rds.aws_db_subnet_group.default' \
             && aws rds describe-db-subnet-groups \
                  --db-subnet-group-name freshbox-db-subnet-group >/dev/null 2>&1; then
            echo "::warning::DB subnet group huérfano; eliminando"
            for i in 1 2 3 4 5 6; do
              aws rds delete-db-subnet-group \
                --db-subnet-group-name freshbox-db-subnet-group && break || sleep 20
            done
          fi

          # --- ECR en cifrado viejo (AES256) pendiente de KMS ---
          # Un repo con imagenes no se puede "reemplazar" (el destroy usa el estado
          # previo con force_delete=false). Se borra para que Terraform lo RECREE limpio.
          for s in get-products create-product update-product delete-product frontend; do
            enc=$(aws ecr describe-repositories --repository-names "freshbox-$s" \
              --query 'repositories[0].encryptionConfiguration.encryptionType' \
              --output text 2>/dev/null || true)
            if [ "$enc" = "AES256" ]; then
              echo "::warning::ECR 'freshbox-$s' en AES256; borrando para recrearlo con KMS"
              aws ecr delete-repository --repository-name "freshbox-$s" --force
            fi
          done

      - name: Adoptar repos ECR existentes (idempotente)
        working-directory: terraform
        run: |
          for s in get-products create-product update-product delete-product frontend; do
            addr="module.ecr.aws_ecr_repository.repo[\"$s\"]"
            if aws ecr describe-repositories --repository-names "freshbox-$s" >/dev/null 2>&1; then
              if ! terraform state list | grep -qF "$addr"; then
                terraform import "$addr" "freshbox-$s" || true
              fi
            fi
          done

      - name: Terraform Apply
        id: apply
        working-directory: terraform
        continue-on-error: true
        run: terraform apply -auto-approve -input=false

      - name: Diagnóstico del apply (si falló)
        if: steps.apply.outcome == 'failure'
        working-directory: terraform
        run: |
          echo "=========== terraform state list ==========="
          terraform state list || true
          echo "=========== EKS ==========="
          aws eks describe-cluster --name freshbox-eks \
            --query 'cluster.{status:status,health:health,version:version}' 2>&1 || true
          echo "=========== RDS ==========="
          aws rds describe-db-instances \
            --query 'DBInstances[].{id:DBInstanceIdentifier,status:DBInstanceStatus}' \
            --output table 2>&1 || true
          echo "=========== errored.tfstate ==========="
          ls -la errored.tfstate 2>/dev/null || echo "sin errored.tfstate"

      - name: Subir errored.tfstate (si existe)
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: errored-tfstate
          path: terraform/errored.tfstate
          if-no-files-found: ignore

      - name: Fallar el job si el apply falló
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> "$GITHUB_OUTPUT"

  # 3. Construye, escanea y publica las imagenes en ECR
  build-and-push:
    needs: terraform
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    strategy:
      matrix:
        include:
          - service: get-products
            context: Freshbox/microserviciosEKSBackend/get-products
          - service: create-product
            context: Freshbox/microserviciosEKSBackend/create-product
          - service: update-product
            context: Freshbox/microserviciosEKSBackend/update-product
          - service: delete-product
            context: Freshbox/microserviciosEKSBackend/delete-product
          - service: frontend
            context: Freshbox/microservicioEKSFrontend
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Scan Docker Image
        run: |
          IMAGE_TAG=${{ steps.login-ecr.outputs.registry }}/freshbox-${{ matrix.service }}:${{ github.sha }}-${{ github.run_number }}
          docker build -t $IMAGE_TAG ${{ matrix.context }}
          docker push $IMAGE_TAG

          # Scan using Trivy (monta el socket para que vea la imagen local)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --image-src docker $IMAGE_TAG

  # 4. Despliega los manifiestos en EKS
  deploy:
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      DB_HOST: ${{ needs.terraform.outputs.rds_endpoint }}
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name freshbox-eks --region ${{ env.AWS_REGION }}

      - name: Apply namespace, configmap and secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create configmap freshbox-config -n freshbox \
            --from-literal=DB_HOST="${DB_HOST}" \
            --from-literal=DB_NAME=freshbox \
            --from-literal=DB_PORT=3306 \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic freshbox-secret -n freshbox \
            --from-literal=DB_USER=alumno \
            --from-literal=DB_PASS=alumno123 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply network policy, HPA and ingress
        run: |
          kubectl apply -f k8s/network-policy.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy services
        run: |
          for s in frontend get-products create-product update-product delete-product; do
            kubectl apply -f k8s/$s-deployment.yaml
            kubectl set image deployment/$s \
              $s=${{ steps.login-ecr.outputs.registry }}/freshbox-$s:${{ github.sha }}-${{ github.run_number }} \
              -n freshbox
          done
          kubectl rollout status deployment -n freshbox --timeout=180s || true

      - name: Diagnóstico K8s (si algo falló)
        if: failure()
        run: |
          echo "=========== NODES ==========="
          kubectl get nodes -o wide || true
          echo "=========== PODS ==========="
          kubectl get pods -n freshbox -o wide || true
          echo "=========== DESCRIBE PODS ==========="
          kubectl describe pods -n freshbox || true
          echo "=========== EVENTS ==========="
          kubectl get events -n freshbox --sort-by=.lastTimestamp || true
          echo "=========== LOGS ==========="
          kubectl logs -n freshbox --all-containers=true --tail=50 \
            -l 'app in (frontend,get-products,create-product,update-product,delete-product)' || true
