apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freshbox-ingress
  namespace: freshbox
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/group.name: freshbox
    alb.ingress.kubernetes.io/conditions.get-products: >-
      [{"field":"http-request-method","httpRequestMethodConfig":{"values":["GET"]}}]
    alb.ingress.kubernetes.io/conditions.create-product: >-
      [{"field":"http-request-method","httpRequestMethodConfig":{"values":["POST"]}}]
    alb.ingress.kubernetes.io/conditions.update-product: >-
      [{"field":"http-request-method","httpRequestMethodConfig":{"values":["PUT"]}}]
    alb.ingress.kubernetes.io/conditions.delete-product: >-
      [{"field":"http-request-method","httpRequestMethodConfig":{"values":["DELETE"]}}]
spec:
  rules:
  - http:
      paths:
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: get-products
            port:
              number: 3001
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: create-product
            port:
              number: 3002
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: update-product
            port:
              number: 3003
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: delete-product
            port:
              number: 3004
