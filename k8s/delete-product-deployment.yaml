apiVersion: apps/v1
kind: Deployment
metadata:
  name: delete-product
  namespace: freshbox
  annotations:
    checkov.io/skip1: CKV_K8S_35=Las credenciales se inyectan por variables de entorno por simplicidad del lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delete-product
  template:
    metadata:
      labels:
        app: delete-product
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: delete-product
        image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/freshbox-delete-product:v1
        ports:
        - containerPort: 3004
        env:
        - name: PORT
          value: "3004"
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: freshbox-config, key: DB_HOST } }
        - name: DB_NAME
          valueFrom: { configMapKeyRef: { name: freshbox-config, key: DB_NAME } }
        - name: DB_PORT
          valueFrom: { configMapKeyRef: { name: freshbox-config, key: DB_PORT } }
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: freshbox-secret, key: DB_USER } }
        - name: DB_PASS
          valueFrom: { secretKeyRef: { name: freshbox-secret, key: DB_PASS } }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 250m, memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet: { path: /health, port: 3004 }
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: { path: /health, port: 3004 }
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: delete-product
  namespace: freshbox
spec:
  selector:
    app: delete-product
  ports:
  - port: 3004
    targetPort: 3004
  type: ClusterIP

